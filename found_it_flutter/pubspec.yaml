name: found_it_flutter
description: Found It — AI-Powered Lost & Found for Colleges, Airports & Offices

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '^3.12.2'
  flutter: '^3.44.4'

resolution: workspace

dependencies:
  cupertino_icons: ^1.0.5
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  found_it_client:
    path: ../found_it_client
  serverpod_flutter: 4.0.3
  serverpod_auth_idp_flutter: 4.0.3
  intl: ^0.20.3
  image_picker: ^1.1.2
  # Map — OpenStreetMap (completely free, no API key needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # Location & permissions (for "Use my current location")
  geolocator: ^13.0.2
  permission_handler: ^11.3.1
  # HTTP (for Nominatim geocoding — free OSM service)
  http: ^1.2.2
  # UI enhancements
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_driver:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'
  flutter_test:
    sdk: flutter

dependency_overrides:
  flutter_secure_storage: ^10.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/config.json
